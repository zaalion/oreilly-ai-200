<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the AI model</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #eef3f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top left, rgba(53, 112, 255, 0.16), transparent 34rem),
        #eef3f8;
    }

    main {
      width: min(760px, 100%);
      padding: 36px;
      border: 1px solid #dbe3ec;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(30, 55, 90, 0.12);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #3667d6;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 14px 0 28px;
      color: #586579;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 145px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #bfcbd9;
      border-radius: 12px;
      color: inherit;
      background: #fbfcfe;
      font: inherit;
      line-height: 1.5;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    textarea:focus {
      outline: none;
      border-color: #356fff;
      box-shadow: 0 0 0 4px rgba(53, 111, 255, 0.14);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
    }

    button {
      min-width: 112px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #225ce8;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    button:hover:not(:disabled) {
      background: #1649bf;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 1.5em;
      color: #657287;
      font-size: 0.92rem;
    }

    #answer-panel {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid #e1e7ef;
    }

    #answer-panel[hidden] {
      display: none;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    #answer {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .error {
      color: #b42318;
    }

    @media (max-width: 560px) {
      main {
        padding: 26px 20px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Microsoft Foundry</p>
    <h1>Ask the AI model</h1>
    <p class="intro">Enter a question and submit it to the deployed <strong>gpt-5-mini</strong> model.</p>

    <form id="ask-form">
      <label for="question">Your question</label>
      <textarea
        id="question"
        name="question"
        maxlength="4000"
        placeholder="What would you like to know?"
        required></textarea>

      <div class="actions">
        <button id="submit-button" type="submit">Ask</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>

    <section id="answer-panel" aria-live="polite" hidden>
      <h2>Answer</h2>
      <p id="answer"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#ask-form");
    const questionInput = document.querySelector("#question");
    const submitButton = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    const answerPanel = document.querySelector("#answer-panel");
    const answer = document.querySelector("#answer");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = questionInput.value.trim();
      if (!question) {
        questionInput.focus();
        return;
      }

      submitButton.disabled = true;
      status.classList.remove("error");
      status.textContent = "Thinking…";
      answerPanel.hidden = true;
      answer.textContent = "";

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error ?? result.detail ?? "The request failed.");
        }

        answer.textContent = result.answer;
        answerPanel.hidden = false;
        status.textContent = "";
      } catch (error) {
        status.classList.add("error");
        status.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
