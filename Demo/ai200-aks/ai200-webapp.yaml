apiVersion: v1
kind: Namespace
metadata:
  name: ai200
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai200-webapp
  namespace: ai200
  annotations:
    azure.workload.identity/client-id: "cd40f448-d101-4da1-b915-bff35f67d753"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai200-webapp
  namespace: ai200
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai200-webapp
  template:
    metadata:
      labels:
        app: ai200-webapp
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai200-webapp
      containers:
        - name: ai200-webapp
          image: oreillyacrai200.azurecr.io/ai200-webapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai200-webapp
  namespace: ai200
spec:
  type: LoadBalancer
  selector:
    app: ai200-webapp
  ports:
    - name: http
      port: 80
      targetPort: http